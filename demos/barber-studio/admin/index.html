<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Studio — Painel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5; color: #111827; min-height: 100vh;
    }

    #no-access {
      display: none; position: fixed; inset: 0;
      background: #f0f2f5; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .na-icon { font-size: 48px; margin-bottom: 16px; }
    .na-box h1 { font-size: 22px; margin-bottom: 8px; }
    .na-box p { color: #6b7280; font-size: 15px; line-height: 1.6; }

    #app { display: none; padding-bottom: 40px; }

    .admin-header {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .admin-header .emoji { font-size: 26px; }
    .admin-header h1 { font-size: 18px; font-weight: 700; }
    .admin-header .badge {
      margin-left: auto; font-size: 11px;
      background: #dcfce7; color: #15803d;
      padding: 3px 8px; border-radius: 20px; font-weight: 600;
    }

    main { max-width: 640px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }

    .section { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; gap: 8px; }
    .section-header h2 { font-size: 15px; font-weight: 700; color: #374151; }
    .section-header .s-emoji { font-size: 18px; }
    .section-body { padding: 20px; }

    .fields { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
    .field input {
      font-size: 16px; padding: 10px 12px;
      border: 1.5px solid #d1d5db; border-radius: 8px;
      color: #111827; background: #fff; outline: none;
      transition: border-color .15s; width: 100%; font-family: inherit;
    }
    .field input:focus { border-color: #2563eb; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-save {
      width: 100%; margin-top: 20px; padding: 13px;
      background: #16a34a; color: #fff; font-size: 15px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; transition: background .15s, opacity .15s;
    }
    .btn-save:hover { background: #15803d; }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Serviços editor ── */
    #services-editor { display: flex; flex-direction: column; gap: 12px; margin-bottom: 4px; }

    .service-row {
      background: #f9fafb; border: 1.5px solid #e5e7eb;
      border-radius: 10px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .service-top { display: grid; grid-template-columns: 48px 1fr 100px; gap: 8px; }
    .service-row input {
      font-size: 14px; padding: 8px 10px;
      border: 1px solid #d1d5db; border-radius: 6px;
      width: 100%; outline: none; font-family: inherit; background: #fff;
    }
    .service-row input:focus { border-color: #2563eb; }
    .service-bottom { display: flex; align-items: center; justify-content: space-between; }
    .featured-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; }
    .featured-wrap input[type=checkbox] { width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer; }
    .btn-remove {
      font-size: 12px; padding: 4px 10px;
      background: none; border: 1px solid #fca5a5;
      color: #dc2626; border-radius: 6px; cursor: pointer;
    }
    .btn-remove:hover { background: #fee2e2; }

    .btn-add {
      width: 100%; padding: 9px; margin-top: 4px;
      background: none; border: 1.5px dashed #d1d5db;
      color: #6b7280; border-radius: 8px; cursor: pointer;
      font-size: 13px; transition: all .15s;
    }
    .btn-add:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1f2937; color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transition: transform .3s ease, opacity .3s ease;
      opacity: 0; pointer-events: none; white-space: nowrap; z-index: 100;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { background: #15803d; }
    #toast.error { background: #dc2626; }

    #loading { display: flex; align-items: center; justify-content: center; min-height: 200px; color: #6b7280; font-size: 15px; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="no-access">
  <div class="na-box">
    <div class="na-icon">🔒</div>
    <h1>Acesso Restrito</h1>
    <p>Este painel requer um link de acesso válido.<br>Contacte a Digital Activation para obter o seu link.</p>
  </div>
</div>

<div id="app">
  <header class="admin-header">
    <span class="emoji">✂️</span>
    <h1>Barber Studio</h1>
    <span class="badge">● Painel activo</span>
  </header>

  <main>
    <div id="loading"><div class="spinner"></div> A carregar…</div>

    <div id="content" style="display:none; flex-direction:column; gap:20px;">

      <!-- Informações -->
      <div class="section">
        <div class="section-header">
          <span class="s-emoji">📋</span>
          <h2>Informações & Contacto</h2>
        </div>
        <div class="section-body">
          <form id="form-info">
            <div class="fields">
              <div class="row-2">
                <div class="field">
                  <label>Telefone (sem espaços)</label>
                  <input type="tel" id="phone" placeholder="265419947">
                </div>
                <div class="field">
                  <label>Telefone (com espaços)</label>
                  <input type="tel" id="phone_display" placeholder="265 419 947">
                </div>
              </div>
              <div class="field">
                <label>Morada — Rua</label>
                <input type="text" id="address_street">
              </div>
              <div class="row-2">
                <div class="field">
                  <label>Cidade</label>
                  <input type="text" id="address_city">
                </div>
                <div class="field">
                  <label>Código Postal</label>
                  <input type="text" id="address_postal">
                </div>
              </div>
              <div class="field">
                <label>Horário — Dias</label>
                <input type="text" id="hours_days" placeholder="Segunda a Sábado">
              </div>
              <div class="row-2">
                <div class="field">
                  <label>Horário da manhã</label>
                  <input type="text" id="hours_morning" placeholder="10h00 – 13h00">
                </div>
                <div class="field">
                  <label>Horário da tarde</label>
                  <input type="text" id="hours_afternoon" placeholder="14h00 – 19h00">
                </div>
              </div>
              <div class="field">
                <label>Nota de encerramento</label>
                <input type="text" id="hours_closed_note" placeholder="Encerra ao Domingo">
              </div>
            </div>
            <button type="submit" class="btn-save">Guardar informações</button>
          </form>
        </div>
      </div>

      <!-- Serviços -->
      <div class="section">
        <div class="section-header">
          <span class="s-emoji">💈</span>
          <h2>Serviços & Preços</h2>
        </div>
        <div class="section-body">
          <div id="services-editor"></div>
          <button type="button" class="btn-add" id="btn-add-service">+ Adicionar serviço</button>
          <button type="button" class="btn-save" id="btn-save-services">Guardar serviços</button>
        </div>
      </div>

    </div>
  </main>
</div>

<div id="toast"></div>

<script>
  const API = 'https://digital-activation.vercel.app/api/save';
  const SITE = 'barber-studio';

  const params = new URLSearchParams(location.search);
  const KEY = params.get('acesso') || '';

  if (!KEY) {
    document.getElementById('no-access').style.display = 'flex';
  } else {
    document.getElementById('app').style.display = 'block';
    init();
  }

  async function init() {
    try {
      const [infoRes, svcRes] = await Promise.all([
        fetch('../_data/content.json'),
        fetch('../_data/servicos.json'),
      ]);
      const info = await infoRes.json();
      const svc = await svcRes.json();

      ['phone','phone_display','address_street','address_city','address_postal',
       'hours_days','hours_morning','hours_afternoon','hours_closed_note'].forEach(k => {
        const el = document.getElementById(k);
        if (el && info[k] != null) el.value = info[k];
      });

      renderServices(svc.items || []);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'flex';
    } catch (e) {
      document.getElementById('loading').innerHTML = '⚠️ Erro ao carregar dados.';
    }
  }

  function renderServices(items) {
    const container = document.getElementById('services-editor');
    container.innerHTML = '';
    items.forEach(item => container.appendChild(buildServiceRow(item)));
  }

  function buildServiceRow(item) {
    const row = document.createElement('div');
    row.className = 'service-row';
    row.innerHTML = `
      <div class="service-top">
        <input type="text" placeholder="Emoji" value="${esc(item.emoji)}" data-field="emoji" style="text-align:center;font-size:20px;">
        <input type="text" placeholder="Nome do serviço" value="${esc(item.name)}" data-field="name">
        <input type="text" placeholder="Preço" value="${esc(item.price)}" data-field="price">
      </div>
      <input type="text" placeholder="Descrição" value="${esc(item.description)}" data-field="description">
      <div class="service-bottom">
        <label class="featured-wrap">
          <input type="checkbox" data-field="featured" ${item.featured ? 'checked' : ''}>
          Destaque
        </label>
        <button type="button" class="btn-remove" onclick="this.closest('.service-row').remove()">Remover</button>
      </div>
    `;
    return row;
  }

  document.getElementById('btn-add-service').addEventListener('click', () => {
    document.getElementById('services-editor').appendChild(
      buildServiceRow({ emoji: '', name: '', description: '', price: '', featured: false })
    );
  });

  function collectServices() {
    const items = [];
    document.querySelectorAll('.service-row').forEach(row => {
      const name = row.querySelector('[data-field="name"]').value.trim();
      if (!name) return;
      items.push({
        emoji: row.querySelector('[data-field="emoji"]').value.trim(),
        name,
        description: row.querySelector('[data-field="description"]').value.trim(),
        price: row.querySelector('[data-field="price"]').value.trim(),
        featured: row.querySelector('[data-field="featured"]').checked,
      });
    });
    return { items };
  }

  document.getElementById('form-info').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn-save');
    const content = {
      phone: v('phone'), phone_display: v('phone_display'),
      address_street: v('address_street'), address_city: v('address_city'),
      address_postal: v('address_postal'), hours_days: v('hours_days'),
      hours_morning: v('hours_morning'), hours_afternoon: v('hours_afternoon'),
      hours_closed_note: v('hours_closed_note'),
      rating_value: '4.9', rating_count: '47', rating_platform: 'Agendoor',
    };
    await save('demos/barber-studio/_data/content.json', content, btn);
  });

  document.getElementById('btn-save-services').addEventListener('click', async () => {
    const btn = document.getElementById('btn-save-services');
    await save('demos/barber-studio/_data/servicos.json', collectServices(), btn);
  });

  async function save(file, content, btn) {
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'A guardar…';
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ site: SITE, file, content, key: KEY }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro desconhecido');
      showToast('✅ Guardado! O site actualiza em ~60 segundos.', 'success');
    } catch (err) {
      showToast('❌ ' + err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }

  function v(id) { return (document.getElementById(id)?.value || '').trim(); }
  function esc(s) { return (s || '').replace(/"/g, '&quot;'); }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = type; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }
</script>
</body>
</html>
