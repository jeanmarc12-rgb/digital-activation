<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Health Report — Digital Activation</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#1a1a2e;--accent:#e94560;--bg:#f4f5f7;--white:#fff;
      --gray:#6b7280;--border:#e5e7eb;--radius:10px;
      --c1:#4361ee;--c2:#7209b7;--c3:#f72585;--c4:#4cc9f0;--c5:#fb8500;--c6:#06d6a0;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#1f2937}
    @media print{body{background:white}.no-print{display:none!important}.pillar-grid{grid-template-columns:repeat(3,1fr)!important}}

    /* Header bar */
    .topbar{background:var(--navy);color:white;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
    .topbar-left .brand{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
    .topbar-left h1{font-size:17px;font-weight:800}
    .topbar-right{display:flex;gap:8px}
    .btn{padding:8px 14px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
    .btn-print{background:rgba(255,255,255,.12);color:white}
    .btn-proposal{background:var(--accent);color:white}
    .btn-back{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}

    .container{max-width:900px;margin:0 auto;padding:24px 16px}

    /* Cover card */
    .cover{background:var(--navy);color:white;border-radius:14px;padding:32px;margin-bottom:20px;display:flex;align-items:center;gap:24px}
    .cover-info{flex:1}
    .cover-info .subtitle{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
    .cover-info h2{font-size:28px;font-weight:900;line-height:1.1;margin-bottom:4px}
    .cover-info .meta{font-size:13px;color:#9ca3af;display:flex;gap:16px;flex-wrap:wrap}
    .grade-block{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
    .grade-big{width:90px;height:90px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900}
    .grade-big.gA{background:#d1fae5;color:#065f46}.grade-big.gB{background:#dbeafe;color:#1e40af}
    .grade-big.gC{background:#fef3c7;color:#92400e}.grade-big.gD{background:#ffe4e6;color:#9f1239}
    .grade-big.gF{background:#fee2e2;color:#7f1d1d}
    .grade-label{font-size:12px;color:#9ca3af;font-weight:600}
    .score-fraction{font-size:20px;font-weight:800;color:white}
    .score-pct{font-size:13px;color:#9ca3af}
    .diagnosis{margin-top:14px;padding:12px 16px;background:rgba(255,255,255,.07);border-radius:8px;font-size:14px;line-height:1.6;color:#d1d5db}

    /* Pillar grid */
    .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--gray);margin:20px 0 12px}
    .pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
    @media(max-width:640px){.pillar-grid{grid-template-columns:1fr 1fr}}
    .pillar-card{background:var(--white);border-radius:var(--radius);padding:16px;border-top:3px solid var(--pc,#ccc);box-shadow:0 2px 6px rgba(0,0,0,.06)}
    .pc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .pc-icon{font-size:18px}
    .pc-name{font-size:13px;font-weight:700;color:#374151}
    .pc-score{font-size:24px;font-weight:900;color:var(--pc);line-height:1}
    .pc-score span{font-size:13px;font-weight:500;color:var(--gray)}
    .score-bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
    .score-bar-fill{height:100%;border-radius:3px;background:var(--pc);transition:width .3s}
    .pc-notes{font-size:12px;color:var(--gray);margin-top:8px;line-height:1.4;font-style:italic}

    /* Chart + Recs layout */
    .insights{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
    @media(max-width:700px){.insights{grid-template-columns:1fr}}
    .chart-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center}
    .chart-card h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:16px;align-self:flex-start}

    /* Recommendations */
    .recs-col{display:flex;flex-direction:column;gap:12px}
    .rec-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
    .rec-card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .rec-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
    .rec-item:last-child{border-bottom:none}
    .rec-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center}
    .rec-body .rec-title{font-size:13px;font-weight:700;color:#1f2937;margin-bottom:2px}
    .rec-body .rec-desc{font-size:12px;color:var(--gray);line-height:1.4}
    .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
    .tag-stream{background:#eff6ff;color:#1d4ed8}

    /* No data state */
    .empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
    .empty-state h2{font-size:20px;margin-bottom:8px;color:#374151}
    .empty-state p{margin-bottom:20px}
  </style>
</head>
<body>

<div class="topbar no-print">
  <div class="topbar-left">
    <div class="brand">Digital Activation</div>
    <h1>Digital Health Report</h1>
  </div>
  <div class="topbar-right">
    <button class="btn btn-back" onclick="window.open('assessment.html','_blank')">← Editar Assessment</button>
    <button class="btn btn-print" onclick="window.print()">🖨 Imprimir PDF</button>
    <button class="btn btn-proposal" onclick="goProposal()">Gerar Proposta →</button>
  </div>
</div>

<div class="container" id="report-container">
  <div class="empty-state">
    <h2>Nenhum dado encontrado</h2>
    <p>Preenche primeiro o assessment para gerar o relatório.</p>
    <a href="assessment.html" style="background:var(--accent);color:white;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px">Ir para o Assessment →</a>
  </div>
</div>

<script>
const PILLAR_META = {
  web:  { name:'Web Presence',    icon:'🌐', color:'#4361ee', stream:'Stream 1 — Foundation' },
  loc:  { name:'Local Discovery', icon:'📍', color:'#7209b7', stream:'Stream 2 — Visibility' },
  rep:  { name:'Reputation',      icon:'⭐', color:'#f72585', stream:'Stream 4 — Reputation' },
  soc:  { name:'Social Media',    icon:'📱', color:'#4cc9f0', stream:'Stream 3 — Engagement' },
  seo:  { name:'SEO & Content',   icon:'🔍', color:'#fb8500', stream:'Stream 2 — Visibility' },
  conv: { name:'Conversion',      icon:'📞', color:'#06d6a0', stream:'Stream 5 — Conversion' },
};

const PILLAR_RECS = {
  web:  { qw:'Actualizar perfil do Facebook com menu, horários e link de contacto', strat:'Criar website profissional, mobile-first, com menu digital e reservas' },
  loc:  { qw:'Criar e completar o Google Business Profile — gratuito, leva <1h', strat:'Otimizar posicionamento Maps e registar em TripAdvisor e Zomato' },
  rep:  { qw:'Responder a todas as reviews existentes esta semana', strat:'Implementar processo sistemático de pedido de reviews pós-refeição' },
  soc:  { qw:'Publicar 3 fotos de qualidade dos pratos esta semana', strat:'Criar calendário editorial mensal com conteúdo de pratos, equipa e bastidores' },
  seo:  { qw:'Garantir consistência de Nome, Morada e Telefone em todas as plataformas', strat:"Trabalhar SEO local para aparecer no top 3 para 'restaurante [cidade]'" },
  conv: { qw:'Tornar o número de telefone clicável no topo do site/perfil social', strat:'Integrar sistema de reservas online (The Fork ou formulário próprio)' },
};

const GRADE_LABELS = { A:'Presença digital excelente', B:'Presença digital sólida', C:'Presença digital moderada', D:'Presença digital fraca', F:'Presença digital crítica' };

function getGrade(pct) {
  if (pct >= 85) return 'A'; if (pct >= 70) return 'B'; if (pct >= 55) return 'C'; if (pct >= 40) return 'D'; return 'F';
}

function drawRadar(pillars) {
  const cx=200, cy=200, r=140;
  const keys = ['web','loc','rep','soc','seo','conv'];
  const angles = [-90,-30,30,90,150,210].map(a=>a*Math.PI/180);
  const scores = keys.map(k => pillars[k]?.score||0);
  const axis = angles.map(a => ({x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}));
  const pts = scores.map((s,i) => ({x:cx+(r*s/20)*Math.cos(angles[i]), y:cy+(r*s/20)*Math.sin(angles[i])}));

  let svg = '';

  // Grid circles
  [.25,.5,.75,1].forEach(f => {
    const gp = angles.map(a=>`${(cx+r*f*Math.cos(a)).toFixed(1)},${(cy+r*f*Math.sin(a)).toFixed(1)}`).join(' ');
    svg += `<polygon points="${gp}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`;
  });

  // Grade labels on first axis (top)
  [5,10,15,20].forEach((v,i) => {
    const f = (i+1)/4;
    svg += `<text x="${(cx+r*f*Math.cos(angles[0])+4).toFixed(1)}" y="${(cy+r*f*Math.sin(angles[0])).toFixed(1)}" font-size="9" fill="#adb5bd" dominant-baseline="middle">${v}</text>`;
  });

  // Axis lines
  axis.forEach(a => { svg += `<line x1="${cx}" y1="${cy}" x2="${a.x.toFixed(1)}" y2="${a.y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`; });

  // Score polygon
  const pstr = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  svg += `<polygon points="${pstr}" fill="rgba(233,69,96,.15)" stroke="#e94560" stroke-width="2.5"/>`;

  // Score dots
  const colors = ['#4361ee','#7209b7','#f72585','#4cc9f0','#fb8500','#06d6a0'];
  pts.forEach((p,i) => { svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${colors[i]}" stroke="white" stroke-width="2"/>`; });

  // Labels
  const labels = ['🌐 Web','📍 Local','⭐ Rep.','📱 Social','🔍 SEO','📞 Conv.'];
  const offset = 22;
  angles.forEach((a,i) => {
    const lx = cx+(r+offset)*Math.cos(a), ly = cy+(r+offset)*Math.sin(a);
    let anchor = 'middle';
    if (lx < cx-10) anchor='end'; else if (lx > cx+10) anchor='start';
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11.5" font-family="system-ui,-apple-system,sans-serif" fill="#374151">${labels[i]}</text>`;
  });

  return `<svg viewBox="0 0 400 400" style="width:100%;max-width:340px">${svg}</svg>`;
}

function buildDiagnosis(data) {
  const keys = ['web','loc','rep','soc','seo','conv'];
  const sorted = [...keys].sort((a,b) => (data.pillars[a]?.score||0) - (data.pillars[b]?.score||0));
  const lowest = PILLAR_META[sorted[0]]?.name || '—';
  const second = PILLAR_META[sorted[1]]?.name || '—';
  const grade = data.grade;
  const labels = { A:'uma presença digital sólida', B:'uma presença digital razoável', C:'uma presença digital moderada', D:'uma presença digital fraca', F:'uma presença digital crítica — está a perder clientes todos os dias' };
  return `<strong>${data.business.name}</strong> tem ${labels[grade]}. O principal ponto crítico é <strong>${lowest}</strong>, seguido de <strong>${second}</strong>. Com as intervenções certas, o score pode melhorar de <strong>${data.pct}%</strong> para estimados <strong>${Math.min(data.pct + 30, 95)}%+</strong> em 90 dias.`;
}

function render(data) {
  const keys = ['web','loc','rep','soc','seo','conv'];
  const grade = data.grade;
  const gradeClass = 'gA gB gC gD gF'.split(' ').find(g => g[1] === grade) || 'gF';

  // Cover
  const coverHtml = `
    <div class="cover">
      <div class="cover-info">
        <div class="subtitle">Digital Health Report</div>
        <h2>${data.business.name}</h2>
        <div class="meta">
          ${data.business.category ? `<span>📌 ${data.business.category}</span>` : ''}
          ${data.business.location ? `<span>📍 ${data.business.location}</span>` : ''}
          <span>📅 ${data.business.date}</span>
          ${data.business.auditor ? `<span>👤 ${data.business.auditor}</span>` : ''}
        </div>
        <div class="diagnosis">${buildDiagnosis(data)}</div>
      </div>
      <div class="grade-block">
        <div class="grade-big ${gradeClass}">${grade}</div>
        <div class="grade-label">${GRADE_LABELS[grade]}</div>
        <div class="score-fraction">${data.total}/120</div>
        <div class="score-pct">${data.pct}% do potencial digital</div>
      </div>
    </div>`;

  // Pillar cards
  const pillarCards = keys.map(k => {
    const p = data.pillars[k] || {score:0, notes:''};
    const m = PILLAR_META[k];
    const pct = Math.round(p.score/20*100);
    return `
      <div class="pillar-card" style="--pc:${m.color}">
        <div class="pc-head">
          <span class="pc-icon">${m.icon}</span>
          <span class="pc-name">${m.name}</span>
        </div>
        <div class="pc-score">${p.score}<span>/20</span></div>
        <div class="score-bar-wrap" style="margin-top:8px"><div class="score-bar-fill" style="width:${pct}%"></div></div>
        ${p.notes ? `<div class="pc-notes">${p.notes}</div>` : ''}
      </div>`;
  }).join('');

  // Sort by score for recommendations
  const sorted = [...keys].sort((a,b) => (data.pillars[a]?.score||0) - (data.pillars[b]?.score||0));
  const qwHtml = sorted.slice(0,3).map(k => {
    const m = PILLAR_META[k]; const r = PILLAR_RECS[k];
    return `<div class="rec-item"><span class="rec-icon">${m.icon}</span><div class="rec-body"><div class="rec-title">${r.qw}<span class="tag tag-stream">${m.stream}</span></div><div class="rec-desc">Score actual: ${data.pillars[k]?.score||0}/20</div></div></div>`;
  }).join('');

  const stratHtml = sorted.slice(0,3).map(k => {
    const m = PILLAR_META[k]; const r = PILLAR_RECS[k];
    return `<div class="rec-item"><span class="rec-icon">🎯</span><div class="rec-body"><div class="rec-title">${r.strat}</div><div class="rec-desc">${m.name} — impacto estimado: +${Math.min(20-(data.pillars[k]?.score||0), 14)} pts neste pilar</div></div></div>`;
  }).join('');

  const html = `
    ${coverHtml}
    <div class="section-title">Score por Pilar</div>
    <div class="pillar-grid">${pillarCards}</div>
    <div class="insights">
      <div class="chart-card">
        <h3>Perfil Digital</h3>
        ${drawRadar(data.pillars)}
      </div>
      <div class="recs-col">
        <div class="rec-card">
          <h3>⚡ Quick Wins — Fazer Esta Semana</h3>
          ${qwHtml}
        </div>
        <div class="rec-card">
          <h3>🚀 Movimentos Estratégicos</h3>
          ${stratHtml}
        </div>
      </div>
    </div>`;

  document.getElementById('report-container').innerHTML = html;
}

function goProposal() {
  try { localStorage.getItem('da_assessment'); } catch(e) { return; }
  window.open('proposal.html', '_blank');
}

// Load data
try {
  const raw = localStorage.getItem('da_assessment');
  if (raw) {
    const data = JSON.parse(raw);
    if (data && data.pillars) render(data);
  }
} catch(e) {}
</script>
</body>
</html>
