# ─────────────────────────────────────────────────────────────
# DIGITAL ACTIVATION — Decap CMS Config
# Painel admin: https://digital-activation.vercel.app/admin/
#
# SETUP (uma vez por projecto):
#   1. Ir a github.com/settings/developers > OAuth Apps > New OAuth App
#   2. Application name: Digital Activation CMS
#   3. Homepage URL: https://digital-activation.vercel.app
#   4. Authorization callback URL: https://digital-activation.vercel.app/admin/
#   5. Copiar o Client ID e colar em app_id abaixo
# ─────────────────────────────────────────────────────────────

backend:
  name: github
  repo: jeanmarc12-rgb/digital-activation
  branch: main
  auth_type: pkce
  app_id: Ov23liypQIrt39T7GLUU

media_folder: uploads
public_folder: /uploads

locale: pt

# ─────────────────────────────────────────────────────────────
# CASA SANTIAGO
# ─────────────────────────────────────────────────────────────
collections:

  - name: casa_santiago_info
    label: "🏠 Casa Santiago — Informações"
    files:
      - label: "Contacto & Horário"
        name: info
        file: "demos/casa-santiago/_data/content.json"
        fields:
          - { label: "Telefone (sem espaços)", name: phone, widget: string, hint: "Ex: 265221688" }
          - { label: "Telefone (com espaços)", name: phone_display, widget: string, hint: "Ex: 265 221 688" }
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "Morada — Rua", name: address_street, widget: string }
          - { label: "Morada — Cidade", name: address_city, widget: string }
          - { label: "Código Postal", name: address_postal, widget: string }
          - { label: "Horário — Dias", name: hours_days, widget: string, hint: "Ex: Segunda a Sábado" }
          - { label: "Horário — Abertura", name: hours_open, widget: string, hint: "Ex: 12h00" }
          - { label: "Horário — Encerramento", name: hours_close, widget: string, hint: "Ex: 22h00" }
          - { label: "Nota de encerramento", name: hours_closed_note, widget: string, hint: "Ex: Encerra ao Domingo" }
          - { label: "Rating (ex: 4.4)", name: rating_value, widget: string }
          - { label: "Nº de avaliações", name: rating_count, widget: string, hint: "Ex: 5.736" }

  - name: casa_santiago_menu
    label: "🍽️ Casa Santiago — Ementa"
    files:
      - label: "Ementa completa"
        name: menu
        file: "demos/casa-santiago/_data/menu.json"
        fields:
          - { label: "Nota de rodapé", name: note, widget: string }
          - label: Categorias
            name: categories
            widget: list
            label_singular: Categoria
            fields:
              - { label: Emoji, name: emoji, widget: string }
              - { label: Título, name: title, widget: string }
              - label: Pratos
                name: items
                widget: list
                label_singular: Prato
                fields:
                  - { label: Nome, name: name, widget: string }
                  - { label: Preço, name: price, widget: string, hint: "Ex: €12 ou Mercado" }
                  - { label: Descrição, name: description, widget: string }

