# ─────────────────────────────────────────────────────────────
# BARBER STUDIO
# ─────────────────────────────────────────────────────────────

  - name: barber_studio_info
    label: "✂️ Barber Studio — Informações"
    files:
      - label: "Contacto & Horário"
        name: info
        file: "demos/barber-studio/_data/content.json"
        fields:
          - { label: "Telefone (sem espaços)", name: phone, widget: string }
          - { label: "Morada — Rua", name: address_street, widget: string }
          - { label: "Horário — Dias", name: hours_days, widget: string }
          - { label: "Horário — Manhã", name: hours_morning, widget: string, hint: "Ex: 10h00 – 13h00" }
          - { label: "Horário — Tarde", name: hours_afternoon, widget: string, hint: "Ex: 14h00 – 19h00" }
          - { label: "Nota de encerramento", name: hours_closed_note, widget: string }

  - name: barber_studio_servicos
    label: "✂️ Barber Studio — Serviços"
    files:
      - label: "Lista de Serviços"
        name: servicos
        file: "demos/barber-studio/_data/servicos.json"
        fields:
          - label: Serviços
            name: items
            widget: list
            label_singular: Serviço
            fields:
              - { label: Emoji, name: emoji, widget: string }
              - { label: Nome, name: name, widget: string }
              - { label: Descrição, name: description, widget: string }
              - { label: Preço, name: price, widget: string, hint: "Ex: €12 ou Consultar" }
              - { label: Destaque, name: featured, widget: boolean, default: false }

